<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#145c32">
  <meta name="description" content="FaST Romania stakeholder mockup — fictional 2025 holding in Mărculești, Ialomița. No live APIs.">
  <title>FaST Romania · mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='12' width='64' height='64' fill='%231f7a45'/%3E%3Cpath d='M18 40c10-18 28-22 28-22s-2 20-16 28c-6 4-16 2-12-6z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
  <div class="desk">
    <div class="phone">
      <div class="app">
        <div class="status">
          <span>14:32</span>
          <span class="mock">FaST Romania · mockup</span>
          <span class="icons">
            <span class="material-symbols-outlined" style="font-size:14px">signal_cellular_alt</span>
            <span class="material-symbols-outlined" style="font-size:14px">wifi</span>
            <span class="material-symbols-outlined" style="font-size:14px">battery_full</span>
          </span>
        </div>
        <header class="header" id="header">
          <button class="back" id="btn-back" aria-label="Back">
            <span class="material-symbols-outlined">arrow_back</span>
          </button>
          <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="#145c32"/>
            <path d="M16 42c12-22 32-26 32-26s-4 24-18 32c-8 4-18 2-14-6z" fill="#fff"/>
            <circle cx="44" cy="18" r="4" fill="#b6f5c8"/>
          </svg>
          <div class="titles">
            <h1 id="hdr-title">FaST</h1>
            <div class="sub" id="hdr-sub">Romania</div>
          </div>
          <span class="badge inv"><span class="dot"></span> Conectat la APIA</span>
        </header>

        <div class="screens">
          <section class="screen active" id="screen-map">
            <div class="map-wrap">
              <div id="home-map"></div>
              <div class="legend">
                <div><span class="swatch" style="background:#E0B429"></span> Grâu</div>
                <div><span class="swatch" style="background:#3FA34A"></span> Porumb</div>
                <div><span class="swatch" style="background:#E08A1A"></span> Floarea-soarelui</div>
                <div><span class="swatch" style="background:#A8C23A"></span> Rapiță</div>
                <div><span class="swatch" style="background:#5BB78A"></span> Pajiște</div>
                <div class="src">Esri World Imagery</div>
              </div>
              <button class="fab" id="btn-locate" aria-label="Fit holding">
                <span class="material-symbols-outlined">my_location</span>
              </button>
              <div class="map-sheet">
                <h2 id="sheet-name">Holding</h2>
                <div class="meta" id="sheet-meta"></div>
                <div class="row">
                  <span class="badge"><span class="dot"></span> Conectat la APIA</span>
                  <button class="chip" data-go="plots">Plot list →</button>
                </div>
              </div>
            </div>
          </section>

          <section class="screen" id="screen-plots">
            <div class="scroll" id="plots-list"></div>
          </section>

          <section class="screen" id="screen-plot">
            <div class="plot-map" id="plot-map"></div>
            <div id="plot-body" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
          </section>

          <section class="screen" id="screen-fert">
            <div class="scroll" id="fert-body"></div>
          </section>

          <section class="screen" id="screen-photos">
            <div class="scroll" id="photos-body"></div>
          </section>

          <section class="screen" id="screen-weather">
            <div class="scroll" id="wx-body"></div>
          </section>

          <section class="screen" id="screen-more">
            <div class="scroll" id="more-body"></div>
          </section>
        </div>

        <nav class="tabbar">
          <button class="tab on" data-tab="map" data-go="map">
            <span class="mi material-symbols-outlined">map</span>Map
          </button>
          <button class="tab" data-tab="plots" data-go="plots">
            <span class="mi material-symbols-outlined">grid_view</span>Plots
          </button>
          <button class="tab" data-tab="photos" data-go="photos">
            <span class="mi material-symbols-outlined">photo_camera</span>Photos
          </button>
          <button class="tab" data-tab="weather" data-go="weather">
            <span class="mi material-symbols-outlined">partly_cloudy_day</span>Weather
          </button>
          <button class="tab" data-tab="more" data-go="more">
            <span class="mi material-symbols-outlined">more_horiz</span>More
          </button>
        </nav>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
